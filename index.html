<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tic Tac Toe Game</title>
    <link rel="stylesheet" href="game.css">
</head>
<body>
    <div class="container">
        <h1>Tic Tac Toe</h1>
        <div class="scoreinfo">
            <p>Current Player: <span id="currentplayer" class="currentplayer x">X</span></p>
            <p id="gamestatus"></p>
        </div>
        
        <div class="gameboard">
            <div class="gamecell" data-index="0"></div>
            <div class="gamecell" data-index="1"></div>
            <div class="gamecell" data-index="2"></div>
            <div class="gamecell" data-index="3"></div>
            <div class="gamecell" data-index="4"></div>
            <div class="gamecell" data-index="5"></div>
            <div class="gamecell" data-index="6"></div>
            <div class="gamecell" data-index="7"></div>
            <div class="gamecell" data-index="8"></div>
        </div>
        
        <button id="resetbtn" class="resetbtn">Reset Game</button>
    </div>

    <script src="game.js"></script>
</body>
</html>
